name: Daily Energy Price Report

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  generate-report:
    runs-on: ubuntu-latest
    concurrency:
      group: daily-report
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Poetry
        uses: snok/install-poetry@v1

      - name: Install dependencies
        run: poetry install

      - name: Restore EEX API cache
        uses: actions/cache/restore@v5
        with:
          path: .cache/
          key: eex-cache-v1

      - name: Checkout gh-pages
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: report
          fetch-depth: 0

      - name: Generate report
        env:
          EEX_API_HEADER_VALUE: ${{ secrets.EEX_API_HEADER_VALUE }}
          EEX_API_HEADER_KEY: ${{ secrets.EEX_API_HEADER_KEY }}
        run: poetry run flep --format markdown --output report/

      - name: Delete existing EEX API cache
        run: |
          gh cache delete eex-cache-v1 || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save EEX API cache
        uses: actions/cache/save@v5
        with:
          path: .cache/
          key: eex-cache-v1

      - name: Commit and push to gh-pages
        working-directory: report
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add .
          git diff --cached --quiet || git commit -m "docs: update daily energy price report"
          git push origin gh-pages

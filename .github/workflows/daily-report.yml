name: Daily Energy Price Report

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  generate-report:
    runs-on: ubuntu-latest
    concurrency:
      group: daily-report
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Poetry
        uses: snok/install-poetry@v1

      - name: Install dependencies
        run: poetry install

      - name: Restore EEX API cache
        uses: actions/cache/restore@v5
        with:
          path: .cache/
          key: eex-cache-v1

      - name: Generate report
        env:
          EEX_API_HEADER_VALUE: ${{ secrets.EEX_API_HEADER_VALUE }}
          EEX_API_HEADER_KEY: ${{ secrets.EEX_API_HEADER_KEY }}
        run: poetry run flep --format markdown --output docs

      - name: Delete existing EEX API cache
        run: gh cache delete eex-cache-v1 || true

      - name: Save EEX API cache
        uses: actions/cache/save@v5
        with:
          path: .cache/
          key: eex-cache-v1

      - name: Setup Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Commit and push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: update daily energy price report"
          file_pattern: docs/*.md docs/**/*.md
          branch: gh-pages
          commit_options: "--allow-empty"
